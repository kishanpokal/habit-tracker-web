<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1A1A24"/>
      <stop offset="100%" stopColor="#0B0B0F"/>
    </radialGradient>

    <!-- Royal Amethyst Gradient -->
    <linearGradient id="amethyst" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#C084FC"/>
      <stop offset="45%" stopColor="#7C3AED"/>
      <stop offset="100%" stopColor="#4C1D95"/>
    </linearGradient>

    <!-- Luminous Gilded Gold Gradient -->
    <linearGradient id="gold" x1="20" y1="8" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FEF08A"/>
      <stop offset="40%" stopColor="#FACC15"/>
      <stop offset="75%" stopColor="#EAB308"/>
      <stop offset="100%" stopColor="#B45309"/>
    </linearGradient>

    <!-- Diamond Apex Gradient -->
    <linearGradient id="diamond" x1="20" y1="4" x2="28" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF"/>
      <stop offset="50%" stopColor="#FEF08A"/>
      <stop offset="100%" stopColor="#EAB308"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Background Vessel with Border -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#272732" stroke-width="1.5"/>

  <!-- 1. The Celestial Orbit (Sacred Enso) -->
  <path
    d="M24 6C13.5066 6 5 14.5066 5 25C5 35.4934 13.5066 44 24 44C32.85 44 40.3 37.95 42.4 29.5"
    stroke="url(#amethyst)"
    stroke-width="3.4"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Orbital Ticks -->
  <circle cx="24" cy="44" r="1.5" fill="#EAB308" opacity="0.9"/>
  <circle cx="5" cy="25" r="1.5" fill="#A855F7" opacity="0.9"/>

  <!-- 2. The Inner Sacred Flame -->
  <path
    d="M24 16C24 16 29 22 29 27C29 31 26.5 34 24 34C21.5 34 19 31 19 27C19 22 24 16 24 16Z"
    fill="url(#gold)"
  />
  <path
    d="M24 22C24 22 26.5 25.5 26.5 28C26.5 30 25.2 31.5 24 31.5C22.8 31.5 21.5 30 21.5 28C21.5 25.5 24 22 24 22Z"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <!-- 3. The Keystone Diamond at Zenith -->
  <polygon
    points="24,4 28.5,9.5 24,15 19.5,9.5"
    fill="url(#diamond)"
    stroke="#FFFFFF"
    stroke-width="0.8"
  />
  <circle cx="24" cy="9.5" r="1.2" fill="#7C3AED"/>
</svg>
